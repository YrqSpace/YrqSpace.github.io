<script>
    function initLoading() {
        var loading = document.querySelector(".loading");
        var hidden = false;
        var captchaStarted = false;

        
        if (window.__turnstilePassed) {
            if (loading) {
                loading.style.display = "none";
            }
            document.documentElement.classList.remove("is-loading");
            return;
        }

        
        function hideLoading() {
            if (!loading || hidden) {
                return;
            }
            hidden = true;
            
            loading.classList.add("is-hidden");
            
            setTimeout(function () {
                loading.style.display = "none";
                
                document.documentElement.classList.remove("is-loading");
            }, 500);
        }

        
        
        function startCaptcha() {
            if (captchaStarted) {
                return;
            }
            captchaStarted = true;

            var spinner = document.querySelector(".loading .spinner");
            var prepare = document.getElementById("captchaPrepare");
            var box = document.getElementById("captchaBox");

            
            if (spinner) {
                spinner.classList.add("is-hidden");
            }
            
            if (prepare) {
                prepare.classList.add("is-show");
            }

            
            setTimeout(function () {
                if (prepare) {
                    prepare.classList.remove("is-show");
                }
                if (box) {
                    box.classList.add("is-show");
                }
                renderTurnstile(box);
            }, 500);
        }

        
        function renderTurnstile(box) {
            if (!box) {
                return;
            }
            var waited = 0;
            var timer = setInterval(function () {
                if (window.turnstile && typeof window.turnstile.render === "function") {
                    clearInterval(timer);
                    doRender(box);
                } else if (waited >= 8000) {
                    clearInterval(timer);
                    box.innerHTML = '<p style="margin:0 0 12px;font-size:13px;text-align:center;">验证组件加载失败，请检查网络后重试</p>';
                    var btn = document.createElement("button");
                    btn.textContent = "重新加载";
                    btn.style.cssText = "display:block;margin:0 auto;padding:8px 18px;border:0;border-radius:8px;background:var(--accent-color,#3b82f6);color:#fff;cursor:pointer;";
                    btn.onclick = function () {
                        location.reload();
                    };
                    box.appendChild(btn);
                }
                waited += 200;
            }, 200);
        }

        function doRender(box) {
            var scheme = document.documentElement.getAttribute("data-scheme");
            var theme = scheme === "dark" ? "dark" : (scheme === "light" ? "light" : "auto");
            try {
                window.turnstile.render(box, {
                    sitekey: "0x4AAAAAAFMoHgJeuUgOvCLv",
                    theme: theme,
                    callback: function () {
                        
                        try { sessionStorage.setItem("turnstile-passed", "1"); } catch (e) {}
                        
                        var prepare = document.getElementById("captchaPrepare");
                        var after = document.getElementById("captchaAfter");
                        if (box) { box.classList.remove("is-show"); }
                        if (prepare) { prepare.classList.remove("is-show"); }
                        if (after) { after.classList.add("is-show"); }
                        setTimeout(hideLoading, 800);
                    }
                });
            } catch (e) {
                box.innerHTML = '<p style="margin:0;font-size:13px;text-align:center;">验证初始化失败，请刷新页面重试</p>';
            }
        }

        
        function whenImageReady(img, callback) {
            if (!img) {
                callback();
                return;
            }
            
            try { img.loading = "eager"; } catch (e) {}
            if (img.complete && img.naturalWidth !== 0) {
                callback();
                return;
            }
            img.addEventListener("load", callback, { once: true });
            img.addEventListener("error", callback, { once: true });
        }

        document.addEventListener('DOMContentLoaded', function () {
            
            var avatar = document.querySelector(".site-avatar img, img.site-logo");

            
            var articles = document.querySelectorAll(".article-list > article, .article-list .article-item");
            var total = articles.length;
            var need = Math.ceil(total / 2);

            var avatarDone = false;
            var articleDone = 0;
            var startScheduled = false;

            function maybeStart() {
                if (avatarDone && articleDone >= need && !startScheduled) {
                    startScheduled = true;
                    
                    setTimeout(startCaptcha, 1000);
                }
            }

            
            whenImageReady(avatar, function () {
                avatarDone = true;
                maybeStart();
            });

            if (need === 0) {
                maybeStart();
            } else {
                var counted = 0;
                Array.prototype.forEach.call(articles, function (article) {
                    if (counted >= need) {
                        return;
                    }
                    counted++;
                    whenImageReady(article.querySelector("img"), function () {
                        articleDone++;
                        maybeStart();
                    });
                });
            }

            
            setTimeout(startCaptcha, 15000);
        });
    }

    initLoading();
</script>

<script>
    (function () {
        function detectBrowser() {
            var ua = navigator.userAgent;
            if (/Edg\//.test(ua) || /EdgiOS\//.test(ua)) return 'Edge';
            if (/OPR\//.test(ua) || /Opera/.test(ua)) return 'Opera';
            if (/Firefox\//.test(ua) || /FxiOS\//.test(ua)) return 'Firefox';
            if (/Chrome\//.test(ua) || /CriOS\//.test(ua)) return 'Chrome';
            if (/Safari\//.test(ua)) return 'Safari';
            return '浏览器';
        }

        
        
        var KEY = 'welcome-shown';

        function alreadyShown() {
            try { return sessionStorage.getItem(KEY) === '1'; } catch (e) { return false; }
        }

        function markShown() {
            try { sessionStorage.setItem(KEY, '1'); } catch (e) { }
        }

        function showWelcome() {
            var toast = document.getElementById('welcome-toast');
            if (!toast) return;

            
            if (alreadyShown()) return;

            var browserSpan = document.getElementById('welcome-browser');
            if (browserSpan) browserSpan.textContent = detectBrowser();

            var closeBtn = toast.querySelector('.welcome-toast__close');
            if (closeBtn) {
                closeBtn.addEventListener('click', function () {
                    toast.classList.remove('is-show');
                });
            }

            
            function reveal() {
                toast.classList.add('is-show');
                markShown();
            }

            function loadingDone() {
                return !document.documentElement.classList.contains('is-loading');
            }

            if (loadingDone()) {
                setTimeout(reveal, 300);
                return;
            }

            var done = false;
            var observer = new MutationObserver(function () {
                if (!done && loadingDone()) {
                    done = true;
                    observer.disconnect();
                    setTimeout(reveal, 300);
                }
            });
            observer.observe(document.documentElement, { attributes: true, attributeFilter: ['class'] });

            
            setTimeout(function () {
                if (!done) {
                    done = true;
                    observer.disconnect();
                    reveal();
                }
            }, 20000);
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', showWelcome);
        } else {
            showWelcome();
        }
    })();
</script>

<script>
(function () {
    function buildAlt(img) {
        if (img.getAttribute('alt') !== null && img.getAttribute('alt').trim() !== '') return null;

        if (img.dataset && img.dataset.key && img.dataset.key.trim()) return img.dataset.key.trim();

        var sec = img.closest('.section-card');
        if (sec) {
            var term = sec.querySelector('.section-term');
            if (term && term.textContent.trim()) return term.textContent.trim();
            var desc = sec.querySelector('.section-description');
            if (desc && desc.textContent.trim()) return desc.textContent.trim();
            var h = sec.querySelector('h1, h2');
            if (h && h.textContent.trim()) return h.textContent.trim();
        }

        var art = img.closest('article') || img.closest('.article-details');
        if (art) {
            var t = art.querySelector('.article-title');
            if (t && t.textContent.trim()) return t.textContent.trim();
        }

        var src = img.getAttribute('src') || '';
        var base = decodeURIComponent(src.split('/').pop().split('?')[0]).replace(/\.[a-z0-9]+$/i, '');
        base = base.replace(/[-_]+/g, ' ').replace(/\s+/g, ' ').trim();
        var pt = document.querySelector('.article-title, h1');
        var pageTitle = pt ? pt.textContent.trim() : '';
        if (base && !/^[\d\s]+$/.test(base)) return base;
        return (pageTitle ? pageTitle + ' ' : '') + '配图';
    }

    function runAltFix() {
        var imgs = document.querySelectorAll('img:not([alt])');
        Array.prototype.forEach.call(imgs, function (img) {
            var a = buildAlt(img);
            if (a) img.setAttribute('alt', a);
        });
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', runAltFix);
    } else {
        runAltFix();
    }
    ['pjax:complete', 'pjax:end', 'pjax:success'].forEach(function (e) {
        document.addEventListener(e, runAltFix);
    });
    window.addEventListener('load', runAltFix);
    setTimeout(runAltFix, 1500);
    setTimeout(runAltFix, 3000);
})();
</script>
