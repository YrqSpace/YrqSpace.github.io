<script>
    const home = "http://localhost:1313/"
    const ap = new APlayer({
        container: document.getElementById('aplayer'),
        fixed: true,
        lrcType: 3,
        audio: [{
            name: '清空',
            artist: '王忻辰 苏星婕',
            url: '/music/qingkong/song.mp3',
            cover: '/music/qingkong/cover.jpg',
            lrc: home + '/music/qingkong/lyric.lrc'
            name: 'river flows in you',
            artist: 'Yiruma',
            url: '/music/river flows in you/song.mp3',
            cover: '/music/river flows in you/cover.jpg',
            lrc: home + '/music/river flows in you/lyric.lrc'
        }]
    });


   

    window.onbeforeunload = () => {
        
        const playInfo = {
            index: ap.list.index,
            currentTime: ap.audio.currentTime,
            paused: ap.paused
        };
        localStorage.setItem("playInfo", JSON.stringify(playInfo));
    };

    

    window.onload = () => {
        
        const playInfo = JSON.parse(localStorage.getItem("playInfo"));
        if (!playInfo) {
            return;
        }
        
        ap.list.switch(playInfo.index);
        
        setTimeout(() => {
            
            ap.seek(playInfo.currentTime);
            
            if (!playInfo.paused) {
                ap.play()
            }
        }, 500);
    };



</script>
