<script>
    function setGiscusTheme(theme) {
        let giscus = document.querySelector("iframe.giscus-frame");
        if (giscus) {
            giscus.contentWindow.postMessage(
                {
                    giscus: {
                        setConfig: {
                            theme: theme,
                        },
                    },
                },
                "https://giscus.app"
            );
        }
    }

    (function () {
        addEventListener("message", (e) => {
            if (event.origin !== "https://giscus.app") return;
            handler();
        });
        window.addEventListener("onColorSchemeChange", handler);

        function handler() {
            if (document.documentElement.dataset.scheme === "light") {
                setGiscusTheme('light');
            } else {
                setGiscusTheme('dark');
            }
        }
    })();
</script>

<div id="aplayer"></div>

<script>
    const home = "https://yrqspace.github.io/"
    const ap = new APlayer({
        container: document.getElementById('aplayer'),
        fixed: true,
        lrcType: 3,
        audio: [{
            name: '清空',
            artist: '王忻辰 苏星婕',
            url: '/music/qingkong/song.mp3',
            cover: '/music/qingkong/cover.jpg',
            lrc: home + '/music/qingkong/lyric.lrc'
        }]
    });


   

    window.onbeforeunload = () => {
        
        const playInfo = {
            index: ap.list.index,
            currentTime: ap.audio.currentTime,
            paused: ap.paused
        };
        localStorage.setItem("playInfo", JSON.stringify(playInfo));
    };

    

    window.onload = () => {
        
        const playInfo = JSON.parse(localStorage.getItem("playInfo"));
        if (!playInfo) {
            return;
        }
        
        ap.list.switch(playInfo.index);
        
        setTimeout(() => {
            
            ap.seek(playInfo.currentTime);
            
            if (!playInfo.paused) {
                ap.play()
            }
        }, 500);
    };



</script>

    script.setAttribute("data-theme", document.documentElement.dataset.scheme === "dark" ? cfg.darkTheme : cfg.lightTheme);
    script.setAttribute("data-lang", cfg.lang);
    script.setAttribute("crossorigin", "anonymous");
    script.async = true;
    if (oldScript) {
      oldScript.parentNode.insertBefore(script, oldScript);
      oldScript.parentNode.removeChild(oldScript);
    } else {
      var anchor = main.querySelector(".site-footer");
      if (anchor) {
        main.insertBefore(script, anchor);
      } else {
        main.appendChild(script);
      }
    }
  });
})();
</script>
