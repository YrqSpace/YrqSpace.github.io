name: 申请友链
description: 提交你的站点，机器人会自动审核并告知结果
title: "[申请友链]"
labels: ["友链申请"]
body:
  - type: markdown
    attributes:
      value: |
        ## 交换须知

        提交前请确认你的站点满足：

        - 全站 HTTPS
        - 内容健康，非采集站 / 镜像站
        - 半年内有更新
        - 独立域名可直接访问（不需要登录才能看）
        - **已经把本站加进你的友链**

        提交后机器人会**自动审核**（大约 1 分钟），结果直接回复在本 Issue 里：

        - **审核通过** → 站长上线时手动加入，你不用催
        - **没通过** → 会写清楚原因和改法，改完**编辑本 Issue 正文**保存，会让它自动重新审核

        | 本站信息 | 内容 |
        | --- | --- |
        | 站点名称 | 爱玩win11的me |
        | 站点域名 | https://yrqspace.github.io |
        | 站点简介 | 一个人的自留地 |

  - type: input
    id: site-name
    attributes:
      label: 站点名称
      description: 显示在友链卡片标题，40 字以内
      placeholder: 例如：小明的小站
    validations:
      required: true

  - type: input
    id: site-url
    attributes:
      label: 站点地址
      description: 必须 https，不要带中文和空格
      placeholder: https://example.com
    validations:
      required: true

  - type: input
    id: site-desc
    attributes:
      label: 站点简介
      description: 一句话介绍，100 字以内
      placeholder: 记录一个前端工程师的日常
    validations:
      required: true

  - type: input
    id: site-avatar
    attributes:
      label: 头像地址
      description: 可选，填了卡片右侧会显示小图
      placeholder: https://example.com/avatar.png
    validations:
      required: false

  - type: input
    id: friend-page
    attributes:
      label: 你的友链页地址
      description: 可选。若本站链接放在单独的友链页而不是首页，填这里，机器人会去那一页检查
      placeholder: https://example.com/links
    validations:
      required: false

  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我的站点已加上本站友链（https://yrqspace.github.io）
          required: true
        - label: 我的站点能正常访问，内容健康
          required: true
